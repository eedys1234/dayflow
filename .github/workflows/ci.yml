name: CI

# 릴리스 때 처음 빌드가 깨지는 상황을 막는다.
on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  rust:
    # Windows 에서 검사한다. 실제 배포 대상이 Windows / macOS 뿐이라
    # Linux 전용 시스템 라이브러리를 설치할 이유가 없다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tauri-build 가 frontendDist(../dist)를 확인하므로 미리 만들어 둔다.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx vite build

      - name: Format check
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        run: cargo test --all
        working-directory: src-tauri
